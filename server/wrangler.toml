name = "career-watch"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# nodejs_compat gives us URL, TextDecoder and friends that the shared core uses.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "career-watch"
# Filled in by: wrangler d1 create career-watch
database_id = "41baea19-f7ec-4180-8246-4a485ed57390"

# Real Chromium, used ONLY for one-off discovery of hard custom career sites
# (e.g. Google's SPA has zero job data in its raw HTML - it only exists after
# JS runs). Never used by the recurring check, which must stay a plain fetch:
# fast, free, and not competing for the free tier's 10 browser-min/day.
[browser]
binding = "BROWSER"

# Fan-out for the company fetch: one queue message per company rather than
# one big loop inside a single invocation. This is what lets the company
# list grow past a few hundred without hitting the 50 (Free) / 1000 (Paid)
# subrequest-per-invocation ceiling - Cloudflare runs up to 250 consumer
# invocations concurrently, each handling a small batch, so total throughput
# scales with concurrency instead of needing ever-bigger single invocations.
# Requires the queue to exist first: `wrangler queues create career-watch-fetch`.
[[queues.producers]]
queue = "career-watch-fetch"
binding = "FETCH_QUEUE"

[[queues.consumers]]
queue = "career-watch-fetch"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 25

# Two crons, deliberately decoupled rather than one: ENQUEUE_CRON fans the
# fetch out to the queue (cheap - no fetching happens here); the second,
# 30 minutes later, runs the per-user notify pass against whatever the queue
# has finished storing by then. No completion-tracking between them - a
# handful of the slowest companies landing just after the notify pass ran
# simply get picked up on the NEXT pass, which is a fine trade for not
# building a distributed "is everyone done yet?" check for a job digest.
# Update ENQUEUE_CRON in index.ts if this first entry ever moves.
[triggers]
crons = ["0 */6 * * *", "30 */6 * * *"]

[observability]
enabled = true

# Secrets are set with `wrangler secret put NAME`, never committed:
#   RESEND_API_KEY   - transactional email (see server/src/email.ts's note on
#                      the onboarding@resend.dev sandbox limitation - it can
#                      only deliver to the Resend account's own verified
#                      address until a sending domain is verified, which
#                      matters now that digests go to real per-user addresses)
#   GOOGLE_CLIENT_ID - OAuth client ID from Google Cloud Console; used to
#                      verify the `aud` claim on every Google ID token
#                      (server/src/auth.ts). The client SECRET lives only in
#                      the Next.js web app (web/.env.local / Vercel project
#                      settings), never here - this Worker never runs the
#                      OAuth redirect flow itself.
#   LLM_API_KEY      - optional, for Scout discovery
#   LLM_BASE_URL     - optional, OpenAI-compatible endpoint
#   LLM_MODEL        - optional, model id at that endpoint
#
# CLIENT_TOKEN is retired by the multi-tenant migration (0006) in favor of
# per-user tokens issued via POST /api/auth/google - safe to delete once
# nothing still depends on it: `wrangler secret delete CLIENT_TOKEN`.
# The old value (6481c1b1...) has been visible in plaintext across dev/test
# tool calls and should not be reused for anything else.
